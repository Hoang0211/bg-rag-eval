# The three rulebooks in the eval corpus. The PDFs are copyrighted and not committed:
# download them from `url` into data/rulebooks/ and check them against `sha256`.
# `markdown` is the hand-made conversion that indexing.py chunks (rules in data/README.md).
# `game` is the id prefix of every chunk from that file.
# `section_notes` (optional) maps a `##` section to a note added to each of its chunks
# at indexing time, for context the rulebook only gives elsewhere (see data/README.md).

